[project]
name = "scout-backend"
version = "0.1.0"
description = "SCOUT Foundation V1.1 backend (local-first)"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "apscheduler==3.10.4",
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "mypy==1.13.0",
  "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.9"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
